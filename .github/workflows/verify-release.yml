name: KYRON Public Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate deterministic DJ Operator manifest
        run: python scripts/generate_dj_operator_release.py
      - name: Verify public repository and discovered releases
        run: python scripts/verify_release.py --repository-safety --repository-root .
      - name: Verify Red Team Auditor public offer boundary
        run: python scripts/verify_red_team_public_offer.py --content --repository-root .
      - name: Run verifier regression tests
        run: python -m unittest discover -s tests -v
